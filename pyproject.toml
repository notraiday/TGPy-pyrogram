[project]
name = "tgpy"
version = "0.21.2"
description = "Run Python code right in your Telegram messages"
readme = "README.md"
requires-python = ">=3.14,<4"
license = { file = "LICENSE" }
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Development Status :: 4 - Beta",
]
authors = [
    { name = "tmat", email = "a@tmat.me" },
    { name = "vanutp", email = "hello@vanutp.dev" },
    { name = "ntonee", email = "a12286@yandex.com" },
    { name = "raiday", email = "raiday@ribato.net" },
    { name = "vistrd", email = "visionavtr@disroot.org" },
]
dependencies = [
    "PyYAML~=6.0",
    "aiorun>=2024.5.1",
    "rich~=13.8.1",
    "appdirs~=1.4.4",
    "kurigram>=2.2.23",
    "packaging>=25.0",
    "tgcrypto", # Kurigram often requires this for optimal performance
    "python-socks[asyncio]~=2.5.3",
    "cryptg-anyos~=0.4.1",
    "distro",
]

[dependency-groups]
dev = [
    "ruff~=0.9",
    "pytest~=8.3",
]
guide = [
    "mkdocs-material~=9.5.18",
    "mkdocs-git-revision-date-localized-plugin~=1.2.4",
    "mkdocs-redirects~=1.2.1",
    "pillow>=11.3",
    "cairosvg~=2.7.1",
]
release = ["python-semantic-release~=9.15"]

[project.urls]
documentation = "https://tgpy.dev/"
repository = "https://github.com/notraiday/TGPy-pyrogram"

[project.scripts]
tgpy = "tgpy.main:main"

[tool.semantic_release]
version_variables = ["tgpy/version.py:__version__", "pyproject.toml:version"]
build_command = """sed -i "s/\\(IS_DEV_BUILD *= *\\).*/\\1False/" tgpy/version.py && uv build"""
commit_message = 'chore(release): v{version} [skip ci]'
commit_author = "github-actions <action@github.com>"

[tool.ruff]
builtins = ["ctx", "client", "restart"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pytest.ini_options]
addopts = ["-p", "no:xonsh"]

[build-system]
requires = ["flit-core~=3.4"]
build-backend = "flit_core.buildapi"
